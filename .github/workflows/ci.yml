name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: bugnet-run
    steps:
      - uses: actions/checkout@v7
        with:
          path: bugnet-run
          persist-credentials: false

      # The module has no dependencies and so no go.sum to key a cache on
      - uses: actions/setup-go@v7
        with:
          go-version-file: bugnet-run/go.mod
          cache: false

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -w needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: bugnet-run

      # Container tests skip unless BUGNET_TEST_DOCKER=1
      - name: go test
        run: |
          set -euo pipefail
          go test -short -timeout 10m ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      # Puts the failing tests' output in an annotation, shown on the run page and the PR
      - name: Report failed tests
        if: failure()
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/go-test.log"
          [ -f "$log" ] || exit 0
          { grep -v -E '^(ok|\?) ' "$log" | grep -E -A 25 -- '--- FAIL|^panic:|^FAIL' || true; } \
            | head -300 \
            | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }' > "$RUNNER_TEMP/failures"
          echo "::error title=go test failures::$(cat "$RUNNER_TEMP/failures")"
