name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Runs on main and feat/router-v1-rest all finish, elsewhere a newer run cancels the older one
concurrency:
  group: >-
    ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' ||
    github.ref == 'refs/heads/feat/router-v1-rest') && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: bugnet-run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bugnet-run
          persist-credentials: false

      # The module has no dependencies and so no go.sum to key a cache on
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bugnet-run/go.mod
          cache: false

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt -w needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: bugnet-run

      # Container tests skip unless BUGNET_TEST_DOCKER=1
      - name: go test
        run: |
          set -euo pipefail
          go test -short -timeout 10m ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      # Gives each failing test, panic or build its own annotation, on the run page and the PR
      - name: Report failed tests
        if: failure()
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/go-test.log"
          [ -f "$log" ] || exit 0
          # An annotation shows at most 4096 characters, so each block stops near 3800
          awk '
            function add(s) {
              if (cut[nb]) return
              if (length(body[nb]) + length(s) > 3800) {
                cut[nb] = 1
                body[nb] = body[nb] "(cut, the step summary has the rest)\n"
                return
              }
              body[nb] = body[nb] s "\n"
            }
            function emit(title, text) {
              sub(/^github\.com\/bugnet-sh\//, "", title)
              gsub(/%/, "%25", title); gsub(/:/, "%3A", title); gsub(/,/, "%2C", title)
              gsub(/%/, "%25", text); gsub(/\r/, "%0D", text); gsub(/\n/, "%0A", text)
              print "::error title=FAIL " title "::" text
            }
            /^(ok|\?) / { nb = 0; body[0] = ""; cut[0] = 0; mode = ""; next }
            /^FAIL$/ { next }
            /^# / { mode = "build"; bpkg = $2; next }
            /^--- FAIL: / || /^panic: test timed out/ || (/^panic: / && nb == 0) {
              mode = "test"; nb++; name[nb] = /^---/ ? $3 : "panic"; body[nb] = ""; cut[nb] = 0
            }
            /^FAIL\t/ {
              pkg = $2
              if (pkg in build) emit(pkg " build", build[pkg])
              else if (nb == 0) emit(pkg, body[0] $0)
              for (i = 1; i <= nb; i++) emit(pkg " " name[i], body[i])
              delete build[pkg]; nb = 0; body[0] = ""; cut[0] = 0; mode = ""
              next
            }
            mode == "build" {
              if (length(build[bpkg]) < 3800) build[bpkg] = build[bpkg] $0 "\n"
              next
            }
            { add($0) }
          ' "$log" > "$RUNNER_TEMP/annotations"
          # A step shows at most 10 error annotations
          n=$(wc -l < "$RUNNER_TEMP/annotations")
          if [ "$n" -gt 10 ]; then
            head -n 9 "$RUNNER_TEMP/annotations"
            echo "::error title=More failures::$((n - 9)) more, listed in the step summary"
          else
            cat "$RUNNER_TEMP/annotations"
          fi
          {
            echo '```text'
            grep -v -E '^(ok|\?) ' "$log" | head -c 900000 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
